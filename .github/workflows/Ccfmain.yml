name: AnDos PC VIRTUAL - Optimizat

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Optimizare Sistem și Interfață
      shell: pwsh
      run: |
        $a="HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
        New-Item $a -Force | Out-Null
        Set-ItemProperty $a TaskbarAl 0 -ErrorAction SilentlyContinue

        # Curățare procese și aplicații preinstalate inutile pentru performanță
        Get-Process -Name "Unity Hub" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Remove-Item "$env:LOCALAPPDATA\Programs\Unity Hub" -Recurse -Force -ErrorAction SilentlyContinue

        # Repornire Explorer pentru aplicarea optimizărilor
        Get-Process explorer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 2
        Start-Process explorer.exe

    - name: Activare RDP
      shell: pwsh
      run: |
        Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Configurare Utilizator RDP
      shell: pwsh
      env:
        PASS: ${{ secrets.RDP_PASSWORD }}
      run: |
        if([string]::IsNullOrWhiteSpace($env:PASS)){
          throw "Configurează secretul RDP_PASSWORD în setările repository-ului."
        }
        $p = ConvertTo-SecureString $env:PASS -AsPlainText -Force$u = Get-LocalUser -Name runneradmin -ErrorAction SilentlyContinue
        if(!$u){
          New-LocalUser -Name runneradmin -Password $p -PasswordNeverExpires
        } else {
          Set-LocalUser -Name runneradmin -Password $p
        }
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member runneradmin -ErrorAction SilentlyContinue

    - name: Instalare Tailscale
      shell: pwsh
      run: |
        $i="$env:TEMP\ts.msi"
        Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile $i
        Start-Process msiexec.exe -ArgumentList "/i `"$i`" /quiet /norestart" -Wait
        Remove-Item $i -Force

    - name: Conectare Tailscale
      shell: pwsh
      env:
        KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      run: |
        if([string]::IsNullOrWhiteSpace($env:KEY)){
          throw "Configurează secretul TAILSCALE_AUTH_KEY în setările repository-ului."
        }
        $ts="C:\Program Files\Tailscale\tailscale.exe"
        & $ts up --authkey="$env:KEY" --hostname="andos-optimizat-${{ github.run_id }}"
        Start-Sleep -Seconds 10
        $ip=(&$ts ip -4 | Select-Object -First 1).Trim()
        Write-Host "IP Conexiune: $ip"

    - name: Menținere Activ (Keep Alive 6 Ore)
      shell: pwsh
      run: |
        $endTime = (Get-Date).AddHours(6)
        Write-Host "============================"
        Write-Host " PC VIRTUAL ACTIV - 6 ORE"
        Write-Host " Expiră la: $endTime"
        Write-Host "============================"

        while ((Get-Date) -lt $endTime) {
          $remaining = ($endTime - (Get-Date)).ToString("hh\:mm\:ss")
          Write-Host "Timp rămas: $remaining"
          Start-Sleep -Seconds 60
        }
        
        Write-Host "Timpul alocat de 6 ore s-a scurs."
